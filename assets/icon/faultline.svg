<?xml version="1.0" encoding="UTF-8"?>
<!-- faultline app icon. Two stacks of rock strata (the two branches) split and offset along a fault line (the
     conflict). Hand-written on a 64 x 64 grid; the GUI draws the same geometry with Java2D (gui/AppIcon.java). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D7BF7"/>
      <stop offset="1" stop-color="#7A4BE8"/>
    </linearGradient>
    <!-- the fault: a polyline from the top edge to the bottom edge -->
    <clipPath id="left">
      <polygon points="0,0 37,0 31,25 37,37 29,64 0,64"/>
    </clipPath>
    <clipPath id="right">
      <polygon points="37,0 64,0 64,64 29,64 37,37 31,25"/>
    </clipPath>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"/>
  <!-- left block: three strata -->
  <g clip-path="url(#left)">
    <rect x="10" y="13" width="30" height="8" rx="2" fill="#FFFFFF"/>
    <rect x="10" y="25" width="30" height="8" rx="2" fill="#FFFFFF" fill-opacity="0.72"/>
    <rect x="10" y="37" width="30" height="8" rx="2" fill="#FFFFFF" fill-opacity="0.45"/>
  </g>
  <!-- right block: the same strata, displaced down along the fault -->
  <g clip-path="url(#right)">
    <rect x="26" y="21" width="28" height="8" rx="2" fill="#FFFFFF"/>
    <rect x="26" y="33" width="28" height="8" rx="2" fill="#FFFFFF" fill-opacity="0.72"/>
    <rect x="26" y="45" width="28" height="8" rx="2" fill="#FFFFFF" fill-opacity="0.45"/>
  </g>
  <!-- the fault line: a gap through the strata, then the crack itself -->
  <polyline points="38,6 31.5,25 37.5,37 30,58" fill="none" stroke="#5A63EF" stroke-width="6.4"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="38,6 31.5,25 37.5,37 30,58" fill="none" stroke="#FF9F43" stroke-width="3.2"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
