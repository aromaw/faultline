<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>faultline report</title>
<style>
:root {
  --ui-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
}
body.light {
  --bg: #ffffff; --fg: #1f1f1f; --muted: #6f737a; --panel: #f7f8fa; --panel2: #ebecf0; --border: #d3d5db;
  --sel: #d5e1ff; --sel-fg: #000; --hover: #e8ecf5; --accent: #3574f0; --gutter: #f7f8fa; --gutter-fg: #9a9da3;
  --add: #d6f5d6; --add-in: #a8e3a8; --mod: #dce7fb; --mod-in: #b2cbf5; --del: #e6e6e6; --del-in: #cfcfcf;
  --conf: #fadcdc; --conf-in: #f2b0b0; --basechg: #f1f3f6; --pad: #f4f4f4; --target: #fff6c8; --target-bd: #e0b000;
  --high: #d93838; --medium: #e08a00; --low: #3d8f3d; --unc: #8a8f98;
  --kw: #0033b3; --str: #067d17; --cm: #8c8c8c; --ann: #9e880d; --num: #1750eb; --tag: #0033b3; --attr: #174ad4;
  --var: #871094; --key: #0033b3; --ent: #1750eb;
}
body.dark {
  --bg: #2b2b2b; --fg: #a9b7c6; --muted: #8c8f94; --panel: #3c3f41; --panel2: #313335; --border: #4b4e50;
  --sel: #2f65ca; --sel-fg: #fff; --hover: #45494a; --accent: #589df6; --gutter: #313335; --gutter-fg: #606366;
  --add: #294436; --add-in: #3d6b50; --mod: #2c4058; --mod-in: #3d5b80; --del: #3f4142; --del-in: #55585a;
  --conf: #573434; --conf-in: #7a4545; --basechg: #323436; --pad: #2f3133; --target: #4d4630; --target-bd: #c9a227;
  --high: #ff6b68; --medium: #e6a23c; --low: #6abf69; --unc: #9da0a5;
  --kw: #cc7832; --str: #6a8759; --cm: #808080; --ann: #bbb529; --num: #6897bb; --tag: #e8bf6a; --attr: #bababa;
  --var: #9876aa; --key: #cc7832; --ent: #6897bb;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.45 var(--ui-font); overflow: hidden; }
code, .mono { font-family: var(--mono); font-size: 12px; }
button { font: inherit; color: inherit; }
#top { display: flex; align-items: center; gap: 16px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--border); height: 52px; }
#top .brand { font-weight: 700; font-size: 15px; letter-spacing: .2px; }
#top .brand span { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
#top .refs { display: grid; grid-template-columns: auto auto auto; column-gap: 14px; row-gap: 0; font-size: 12px; color: var(--muted); flex: 1; min-width: 0; }
#top .refs b { color: var(--fg); font-weight: 600; }
#top .refs div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { display: flex; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--border); font-size: 12px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.g-HIGH { background: var(--high); } .g-MEDIUM { background: var(--medium); } .g-LOW { background: var(--low); } .g-UNCERTAIN { background: var(--unc); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); padding: 3px 10px; cursor: pointer; font-size: 12px; }
.seg button.on { background: var(--accent); color: #fff; }
.btn { border: 1px solid var(--border); background: var(--bg); border-radius: 5px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
.btn:hover { background: var(--hover); }
#main { display: flex; height: calc(100% - 52px); }
#side { width: 330px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--border); }
#side .search { padding: 8px; border-bottom: 1px solid var(--border); }
#search { width: 100%; padding: 5px 8px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); color: var(--fg); font: inherit; }
#filters { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
#filters label { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; font-size: 11.5px; user-select: none; }
#filters input { margin: 0; }
#tree { overflow: auto; flex: 1; padding: 4px 0 20px; }
.grp > .gh { display: flex; align-items: center; gap: 6px; padding: 4px 8px; font-weight: 600; cursor: pointer; user-select: none; }
.cat > .ch { display: flex; align-items: center; gap: 6px; padding: 2px 8px 2px 22px; color: var(--muted); cursor: pointer; user-select: none; font-size: 12px; }
.count { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 11.5px; }
.caret { width: 10px; display: inline-block; color: var(--muted); font-size: 10px; }
.collapsed > .items, .collapsed > .cats { display: none; }
.item { padding: 3px 8px 3px 38px; cursor: pointer; display: flex; flex-direction: column; border-left: 3px solid transparent; }
.item:hover { background: var(--hover); }
.item.sel { background: var(--sel); color: var(--sel-fg); border-left-color: var(--accent); }
.item .l1 { display: flex; gap: 6px; align-items: center; min-width: 0; }
.item .sym { font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .l2 { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item.sel .l2 { color: inherit; opacity: .8; }
.num { color: var(--muted); font-size: 11px; min-width: 22px; }
.item.sel .num { color: inherit; }
#content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#card { padding: 10px 14px; border-bottom: 1px solid var(--border); max-height: 40%; overflow: auto; }
#card .row1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 4px; color: #fff; }
.badge.HIGH { background: var(--high); } .badge.MEDIUM { background: var(--medium); } .badge.LOW { background: var(--low); } .badge.UNC { background: var(--unc); }
.tag { font-size: 11.5px; padding: 1px 6px; border-radius: 4px; background: var(--panel2); border: 1px solid var(--border); }
#card .symbol { font-family: var(--mono); font-size: 13.5px; font-weight: 600; margin: 6px 0 2px; word-break: break-all; }
#card .msg { margin: 4px 0; }
#card dl { display: grid; grid-template-columns: max-content 1fr; gap: 1px 10px; margin: 4px 0; font-size: 12px; }
#card dt { color: var(--muted); }
#card dd { margin: 0; word-break: break-word; font-family: var(--mono); font-size: 11.5px; }
.jumps { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.jump { display: flex; gap: 8px; align-items: baseline; cursor: pointer; padding: 1px 4px; border-radius: 4px; font-size: 12px; }
.jump:hover { background: var(--hover); }
.jump.on { background: var(--sel); color: var(--sel-fg); }
.jump .side { font-size: 10.5px; font-weight: 700; text-transform: uppercase; min-width: 52px; color: var(--accent); }
.jump.on .side { color: inherit; }
.jump .loc { font-family: var(--mono); font-size: 11.5px; }
.jump .lbl { color: var(--muted); }
.jump.on .lbl { color: inherit; opacity: .85; }
#filebar { display: flex; align-items: center; gap: 8px; padding: 5px 10px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
#filebar .path { font-family: var(--mono); font-size: 12px; font-weight: 600; }
.legend { display: flex; gap: 8px; margin-left: auto; font-size: 11px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 12px; height: 10px; border: 1px solid var(--border); vertical-align: -1px; margin-right: 3px; }
#diff { flex: 1; overflow: auto; position: relative; }
table.diff { border-collapse: collapse; width: 100%; table-layout: fixed; font-family: var(--mono); font-size: 12px; line-height: 18px; }
table.diff col.ln { width: 46px; } table.diff col.gap { width: 8px; }
table.diff thead th { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--border); font: 600 12px var(--ui-font); text-align: left; padding: 4px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.diff thead th.gap { padding: 0; }
td.ln { background: var(--gutter); color: var(--gutter-fg); text-align: right; padding: 0 6px 0 0; vertical-align: top; user-select: none; border-right: 1px solid var(--border); }
td.code { padding: 0 8px; white-space: pre-wrap; word-break: break-all; vertical-align: top; tab-size: 4; }
td.gap { padding: 0; background: var(--bg); border-left: 1px solid var(--border); }
td.gap.h { background: var(--border); }
td.k-add { background: var(--add); } td.k-mod { background: var(--mod); } td.k-del { background: var(--del); }
td.k-conf { background: var(--conf); } td.k-basechg { background: var(--basechg); } td.k-baseconf { background: var(--conf); opacity: .85; }
td.k-pad { background: var(--pad); } td.k-delpad { background: repeating-linear-gradient(135deg, var(--del) 0 4px, var(--pad) 4px 8px); }
td.k-add .in { background: var(--add-in); } td.k-mod .in { background: var(--mod-in); } td.k-conf .in { background: var(--conf-in); } td.k-del .in { background: var(--del-in); } td.k-basechg .in { background: var(--del-in); }
.in { border-radius: 2px; }
tr.target td.code.tside { box-shadow: inset 3px 0 0 var(--target-bd), inset 0 1px 0 var(--target-bd), inset 0 -1px 0 var(--target-bd); }
tr.target td.ln.tside { background: var(--target); color: var(--fg); font-weight: 700; }
tr.target td.code.tside.k-eq, tr.target td.code.tside.k-basechg { background: var(--target); }
tr.flash td.code { animation: flash 1s ease-out; }
@keyframes flash { from { filter: brightness(.85); } to { filter: none; } }
tr.fold td { background: var(--panel); color: var(--muted); text-align: center; cursor: pointer; font: 11.5px var(--ui-font); padding: 2px; border-top: 1px dashed var(--border); border-bottom: 1px dashed var(--border); }
tr.fold td:hover { color: var(--accent); }
.empty { padding: 30px; color: var(--muted); }
.absent { color: var(--muted); font-style: italic; }
.tk-kw { color: var(--kw); font-weight: 600; } .tk-str { color: var(--str); } .tk-cm { color: var(--cm); font-style: italic; }
.tk-ann { color: var(--ann); } .tk-num { color: var(--num); } .tk-tag { color: var(--tag); } .tk-attr { color: var(--attr); }
.tk-var { color: var(--var); font-weight: 600; } .tk-key { color: var(--key); } .tk-ent { color: var(--ent); }
body.dark .tk-kw { font-weight: 400; }
.hint { font-size: 11px; color: var(--muted); }
/* ---- context view: tabs, dependency / impact trees, checklist, overview */
#tabs { display: flex; gap: 2px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--border); }
#tabs button { border: 0; background: none; padding: 6px 12px 5px; cursor: pointer; font-size: 12.5px; color: var(--muted); border-bottom: 2px solid transparent; }
#tabs button:hover { color: var(--fg); }
#tabs button.on { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
#tabs button .cnt { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 3px; }
#work { flex: 1; min-height: 0; display: flex; }
#ctx { width: 40%; min-width: 240px; overflow: auto; border-right: 1px solid var(--border); padding: 6px 0 24px; display: none; }
#ctx.wide { width: 58%; }
body.ctxmode #ctx { display: block; }
#split { display: none; width: 5px; flex: none; cursor: col-resize; background: var(--border); opacity: .5; }
#split:hover, #split.drag { opacity: 1; background: var(--accent); }
body.ctxmode #split { display: block; }
#viewer { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.chainbar { margin: 2px 10px 8px; padding: 6px 9px; border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 4px; background: var(--panel); font-size: 12px; line-height: 1.6; }
.chainbar b { font-family: var(--mono); }
.sec { padding: 4px 10px 2px; font-weight: 600; font-size: 12.5px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.sec .hint { font-weight: 400; }
.slegend { display: flex; gap: 6px; flex-wrap: wrap; padding: 2px 10px 6px; }
.tn { display: flex; align-items: center; gap: 5px; padding: 2px 8px 2px 0; cursor: pointer; white-space: nowrap; font-size: 12px; border-left: 3px solid transparent; min-width: max-content; }
.tn:hover { background: var(--hover); }
.tn.sel { background: var(--sel); color: var(--sel-fg); border-left-color: var(--accent); }
.tn.subject .lbl { font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.tn .tw { width: 12px; flex: none; text-align: center; color: var(--muted); font-size: 9px; }
.tn .lbl { font-family: var(--mono); font-size: 12px; max-width: 52ch; overflow: hidden; text-overflow: ellipsis; }
.tn .chg, .tn .loc { color: var(--muted); font-size: 11px; }
.tn.sel .chg, .tn.sel .loc { color: inherit; opacity: .85; }
.tn .at { color: var(--accent); font-size: 11px; text-decoration: none; border-bottom: 1px dotted var(--accent); }
.tn.sel .at { color: inherit; border-bottom-color: currentColor; }
.tn .flag { font-size: 10.5px; padding: 0 4px; border-radius: 3px; border: 1px dashed var(--border); color: var(--muted); }
.tn.more { color: var(--muted); font-style: italic; }
.tc.shut { display: none; }
.kb { display: inline-block; min-width: 26px; text-align: center; font: 700 10px/15px var(--mono); border-radius: 3px; padding: 0 3px; color: #fff; flex: none; }
.k-cls { background: #3d7fd9; } .k-mth { background: #8250c4; } .k-fld { background: #c2741e; } .k-bean { background: #2f8a5a; }
.k-cfg { background: #6b7280; } .k-sql { background: #b3437a; } .k-lib { background: #7d6b2d; } .k-mvn { background: #a33b3b; }
.st { font: 700 10px/15px var(--ui-font); padding: 0 5px; border-radius: 8px; text-transform: lowercase; flex: none; border: 1px solid transparent; }
.st-PRESENT { color: var(--low); border-color: var(--low); } .st-MISSING { background: var(--high); color: #fff; }
.st-CHANGED { background: var(--medium); color: #fff; } .st-DIFFERS { color: var(--accent); border-color: var(--accent); }
.st-UNKNOWN { color: var(--unc); border-color: var(--unc); border-style: dashed; }
.fchip { font: 600 10.5px var(--mono); padding: 0 4px; border-radius: 3px; background: var(--panel2); border: 1px solid var(--border); cursor: pointer; color: var(--fg); }
.fchip.cur { background: var(--accent); color: #fff; border-color: var(--accent); }
.nl { color: var(--accent); cursor: pointer; font-family: var(--mono); }
ol.check { list-style: none; margin: 0; padding: 0 6px; }
ol.check li { display: grid; grid-template-columns: 26px 18px 1fr; gap: 2px 6px; padding: 5px 6px; border-bottom: 1px solid var(--border); cursor: pointer; align-items: start; }
ol.check li:hover { background: var(--hover); }
ol.check li.sel { background: var(--sel); color: var(--sel-fg); }
ol.check li.done .what { text-decoration: line-through; opacity: .6; }
ol.check .stepn { font: 700 12px var(--mono); color: var(--muted); text-align: right; padding-top: 1px; }
ol.check li.sel .stepn { color: inherit; }
ol.check .what { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
ol.check .act { grid-column: 3; font-size: 12px; }
ol.check .why { grid-column: 3; font-size: 11px; color: var(--muted); }
ol.check li.sel .why { color: inherit; opacity: .85; }
.ovr svg { display: block; margin: 4px 10px; }
.ovr .fnode rect { fill: var(--bg); stroke: var(--border); stroke-width: 1.2; }
.ovr .fnode { cursor: pointer; }
.ovr .fnode:hover rect { fill: var(--hover); }
.ovr .fnode.sel rect { stroke: var(--accent); stroke-width: 2.2; }
.ovr .fnode text { font: 12px var(--ui-font); fill: var(--fg); }
.ovr .fnode text.mod { font-size: 10.5px; fill: var(--muted); }
.ovr .edge { fill: none; stroke: var(--muted); stroke-width: 1.3; opacity: .8; }
.ovr .mcol { font: 600 11px var(--ui-font); fill: var(--muted); }
.ovr .bar { stroke: none; }
.limits { margin: 14px 10px 0; font-size: 11px; color: var(--muted); }
.limits li { margin: 2px 0; }
#groupSeg { margin-top: 6px; }
.ctag { font: 600 10px var(--mono); color: var(--accent); margin-left: 4px; }
.item.sel .ctag { color: inherit; }
.chainline { margin: 4px 0 0; font-size: 12px; }
kbd { font: 10.5px var(--mono); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 3px; padding: 0 3px; background: var(--bg); }
/* ---- conflict mode */
.sidehdr { padding: 8px 8px 2px; font: 600 11px var(--ui-font); color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.item.hunk .l1 .sym { flex: 1; min-width: 0; }
.mini { font: 700 9.5px/14px var(--ui-font); padding: 0 4px; border-radius: 3px; flex: none; border: 1px solid var(--border); color: var(--muted); }
.mini.red { background: var(--high); color: #fff; border-color: transparent; }
.mini.amb { background: var(--medium); color: #fff; border-color: transparent; }
.mini.blu { color: var(--accent); border-color: var(--accent); }
.item.sel .mini { border-color: currentColor; }
.cat > .ch .fname { font-family: var(--mono); font-size: 11.5px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
tr.creg td.ln { background: var(--target); color: var(--fg); font-weight: 700; box-shadow: inset -3px 0 0 var(--target-bd); }
tr.creg2 td.ln { box-shadow: inset -3px 0 0 var(--high); }
.ptext { padding: 2px 12px 8px; font-size: 12.5px; line-height: 1.55; }
.ptext.box { margin: 2px 10px 8px; padding: 6px 9px; border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 4px; background: var(--panel); }
.ptext.warn { border-left-color: var(--medium); }
table.ctable { width: calc(100% - 16px); margin: 2px 8px 10px; border-collapse: collapse; font-size: 12px; }
table.ctable th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; padding: 3px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.ctable td { padding: 4px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.ctable tr[data-node] { cursor: pointer; }
table.ctable tr[data-node]:hover td { background: var(--hover); }
table.ctable tr.sel td { background: var(--sel); color: var(--sel-fg); }
table.ctable tr.faint td { opacity: .55; }
table.ctable .sym { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
table.ctable .det { color: var(--muted); font-size: 11px; }
.og { font: 700 9.5px/15px var(--ui-font); padding: 0 5px; border-radius: 3px; border: 1px solid var(--border); white-space: nowrap; display: inline-block; }
.og-ADDED_ON_MAINLINE, .og-LIBRARY { background: var(--high); color: #fff; border-color: transparent; }
.og-RENAMED_ON_MAINLINE, .og-MOVED_ON_MAINLINE, .og-SIGNATURE_CHANGED_ON_MAINLINE, .og-CHANGED_BY_TENANT { background: var(--medium); color: #fff; border-color: transparent; }
.og-IN_PICK, .og-IN_HUNK { color: var(--accent); border-color: var(--accent); }
.og-PRESENT { color: var(--low); border-color: var(--low); }
.sha { font: 11.5px var(--mono); color: var(--accent); white-space: nowrap; }
.ev { display: grid; grid-template-columns: 76px 78px 1fr; gap: 0 8px; padding: 3px 12px; font-size: 12px; border-bottom: 1px solid var(--border); align-items: baseline; }
.ev .k { font: 700 10px var(--ui-font); text-transform: lowercase; color: var(--muted); }
.ev .s { color: var(--muted); font-size: 11.5px; }
.ev .m { font-family: var(--mono); font-size: 11.5px; }
.ev[data-node] { cursor: pointer; }
.ev[data-node]:hover { background: var(--hover); }
.blame { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 12px 8px; }
.blame span { font: 11px var(--mono); padding: 1px 5px; border-radius: 3px; background: var(--panel2); border: 1px solid var(--border); }
.blame span.new { border-color: var(--medium); }
.ab { font: 700 10px/15px var(--ui-font); padding: 0 5px; border-radius: 3px; color: #fff; background: var(--unc); white-space: nowrap; }
.ab-CONSIDER_COMMIT { background: #8250c4; } .ab-BRING, .ab-BRING_FILE { background: var(--high); } .ab-ADAPT { background: var(--medium); }
.ab-RESOLVE { background: var(--accent); } .ab-CHECK_FINDING { background: var(--unc); }
.hchip { font: 600 10.5px var(--mono); padding: 0 4px; border-radius: 3px; background: var(--panel2); border: 1px solid var(--border); cursor: pointer; white-space: nowrap; }
.hchip.cur { background: var(--accent); color: #fff; border-color: var(--accent); }
ol.check li.mine { box-shadow: inset 3px 0 0 var(--accent); }
.eproute { font: 600 12px var(--mono); }
.sg { font: 700 10.5px var(--mono); padding: 0 5px; border-radius: 3px; color: #fff; white-space: nowrap; text-transform: lowercase; }

<body class="light">
<header id="top">
  <div class="brand">faultline<span>merge gap report</span></div>
  <div class="refs" id="refs"></div>
  <div class="chips" id="chips"></div>
  <div class="seg" id="modeSeg"><button data-mode="3col">ours | base | theirs</button><button data-mode="2col">ours | theirs</button></div>
  <button class="btn" id="themeBtn" title="Toggle light / dark theme">Dark</button>
</header>
<div id="main">
  <aside id="side">
    <div class="search">
      <input id="search" type="search" placeholder="Search symbol, file, message..." autocomplete="off">
      <div id="filters"></div>
      <div class="seg" id="groupSeg"><button data-group="sev">By severity</button><button data-group="chain">By chain</button></div>
    </div>
    <div id="tree"></div>
  </aside>
  <section id="content">
    <div id="card"></div>
    <nav id="tabs"><button data-tab="code">Code</button><button data-tab="deps">Dependency chain</button><button data-tab="impact">Reverse impact</button><button data-tab="check">Port checklist</button><button data-tab="overview">Overview</button></nav>
    <div id="work">
      <div id="ctx"></div>
      <div id="split" title="drag to resize"></div>
      <div id="viewer"><div id="filebar"></div><div id="diff"></div></div>
    </div>
  </section>
</div>
<script type="application/json" id="faultline-data">"__FAULTLINE_DATA__"</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("faultline-data").textContent);
  var GROUPS = ["HIGH", "MEDIUM", "LOW", "UNCERTAIN"];
  var CONTEXT_LINES = 3; // unchanged lines kept around each hunk
  var state = { sel: null, target: 0, path: null, mode: "3col", theme: "light", hidden: {}, q: "", expanded: {}, collapsed: {}, hunk: -1,
    tab: "code", node: null, nodeTarget: null, groupBy: "sev", done: {}, ovScope: "chain", ovFile: null,
    kind: "finding", hid: null, ctab: "c-conflict", ctarget: null };
  var byId = {};
  DATA.findings.forEach(function (f) { byId[f.id] = f; });
  // code-context view (dependency / impact trees, chains, checklists); null when the analysis could not build it
  var CTX = DATA.context || null;
  var CHAINS = {};
  if (CTX) CTX.chains.forEach(function (c) { CHAINS[c.id] = c; });
  function fctx(f) { return CTX && f ? CTX.findings[f.id] || CTX.findings[String(f.id)] : null; }
  function chainOf(f) { var c = fctx(f); return c && c.chain ? CHAINS[c.chain] : null; }
  function nodeOf(key) { return CTX ? CTX.nodes[key] : null; }

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function short(sha) { return sha ? String(sha).slice(0, 8) : ""; }
  function refParts(s) { var m = /^(.*) \(([0-9a-f]{7,})\)$/.exec(s || ""); return m ? { ref: m[1], sha: m[2] } : { ref: "", sha: s || "" }; }

  // ------------------------------------------------------------------ header
  function header() {
    var m = DATA.meta, o = refParts(m.refs.ours), t = refParts(m.refs.theirs);
    $("refs").innerHTML =
      "<div>repo <b>" + esc(m.repo) + "</b></div><div>service dir <b>" + esc(m.serviceDir) + "</b></div><div>generated <b>" + esc((m.generatedAt || "").replace("T", " ").replace(/\.\d+/, "")) + "</b></div>" +
      "<div>ours <b>" + esc(o.ref) + "</b> <code>" + short(o.sha) + "</code></div><div>merge-base <code>" + short(m.refs.mergeBase) + "</code></div><div>theirs <b>" + esc(t.ref) + "</b> <code>" + short(t.sha) + "</code></div>";
    var counts = {};
    DATA.findings.forEach(function (f) { counts[f.group] = (counts[f.group] || 0) + 1; });
    $("chips").innerHTML = GROUPS.map(function (g) {
      return '<span class="chip" title="' + g + '"><span class="dot g-' + g + '"></span>' + g.charAt(0) + g.slice(1).toLowerCase() + " <b>" + (counts[g] || 0) + "</b></span>";
    }).join("") + '<span class="chip">Total <b>' + DATA.findings.length + "</b></span>";
    $("filters").innerHTML = GROUPS.map(function (g) {
      return '<label><input type="checkbox" data-g="' + g + '" checked><span class="dot g-' + g + '"></span>' + g + " " + (counts[g] || 0) + "</label>";
    }).join("");
  }

  // ------------------------------------------------------------------ tree
  function shortSymbol(f) {
    var s = f.symbol || "";
    if (f.category === "MAVEN_DEPENDENCY") return s.split(":").pop();
    var hash = s.indexOf("#");
    if (hash > 0) { var cls = s.slice(0, hash); return cls.slice(cls.lastIndexOf(".") + 1) + "#" + s.slice(hash + 1); }
    if (/^[a-z][\w]*(\.[a-z][\w]*)+\.[A-Z]/.test(s)) {
      var parts = s.split(".");
      var i = parts.findIndex(function (p) { return /^[A-Z]/.test(p); });
      return parts.slice(i).join(".");
    }
    return s;
  }
  function primaryLoc(f) {
    var t = f.targets[0];
    return t ? t.path.split("/").pop() + (t.line ? ":" + t.line : "") : "";
  }
  function matches(f) {
    if (state.hidden[f.group]) return false;
    if (!state.q) return true;
    var hay = (f.symbol + " " + f.message + " " + f.status + " " + f.category + " " + f.kind + " " +
      f.targets.map(function (t) { return t.path + ":" + t.line; }).join(" ")).toLowerCase();
    return state.q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
  }
  function itemHtml(f) {
    var c = chainOf(f), tag = c && c.findings.length > 1 ? '<span class="ctag" title="part of dependency chain ' + c.id + '">\u26D3' + c.id + "</span>" : "";
    return '<div class="item' + (state.sel === f.id ? " sel" : "") + '" data-id="' + f.id + '" title="' + esc(f.symbol) + '"><div class="l1"><span class="num">' + f.id + '</span><span class="sym">' + esc(shortSymbol(f)) + "</span>" + tag + '</div><div class="l2">' + esc(f.status + " \u00B7 " + primaryLoc(f)) + "</div></div>";
  }
  function chainTree() {
    var html = "", singles = [];
    CTX.chains.forEach(function (c) {
      var fs = c.findings.map(function (id) { return byId[id]; }).filter(function (f) { return f && matches(f); });
      if (!fs.length) return;
      if (c.findings.length < 2) { singles = singles.concat(fs); return; }
      var key = "chain/" + c.id, root = nodeOf(c.root);
      html += '<div class="grp' + (state.collapsed[key] ? " collapsed" : "") + '" data-g="' + key + '"><div class="gh" title="' + esc(root ? root.symbol : "") + '"><span class="caret">' + (state.collapsed[key] ? "\u25B6" : "\u25BC") + '</span><span style="flex:none;white-space:nowrap">\u26D3 ' + c.id + '</span><span class="sym" style="flex:1;min-width:0;white-space:nowrap;font:400 11.5px var(--mono);overflow:hidden;text-overflow:ellipsis">' + esc(root ? root.label : c.root) + '</span><span class="count">' + fs.length + '</span></div><div class="items">';
      fs.forEach(function (f) { html += itemHtml(f); });
      html += "</div></div>";
    });
    if (singles.length) {
      var k = "chain/standalone";
      html += '<div class="grp' + (state.collapsed[k] ? " collapsed" : "") + '" data-g="' + k + '"><div class="gh"><span class="caret">' + (state.collapsed[k] ? "\u25B6" : "\u25BC") + '</span>Standalone findings<span class="count">' + singles.length + '</span></div><div class="items">';
      singles.sort(function (a, b) { return a.id - b.id; }).forEach(function (f) { html += itemHtml(f); });
      html += "</div></div>";
    }
    $("tree").innerHTML = conflictTreeHtml() + (html || '<div class="empty">No findings match.</div>');
  }
  function tree() {
    if (state.groupBy === "chain" && CTX) { chainTree(); return; }
    var html = "";
    GROUPS.forEach(function (g) {
      var fs = DATA.findings.filter(function (f) { return f.group === g && matches(f); });
      if (!fs.length) return;
      var cats = [];
      fs.forEach(function (f) { if (cats.indexOf(f.category) < 0) cats.push(f.category); });
      html += '<div class="grp' + (state.collapsed[g] ? " collapsed" : "") + '" data-g="' + g + '"><div class="gh"><span class="caret">' + (state.collapsed[g] ? "\u25B6" : "\u25BC") + '</span><span class="dot g-' + g + '"></span>' + g + '<span class="count">' + fs.length + '</span></div><div class="cats">';
      cats.forEach(function (c) {
        var key = g + "/" + c, items = fs.filter(function (f) { return f.category === c; });
        html += '<div class="cat' + (state.collapsed[key] ? " collapsed" : "") + '" data-c="' + key + '"><div class="ch"><span class="caret">' + (state.collapsed[key] ? "\u25B6" : "\u25BC") + "</span>" + c + '<span class="count">' + items.length + '</span></div><div class="items">';
        items.forEach(function (f) { html += itemHtml(f); });
        html += "</div></div>";
      });
      html += "</div></div>";
    });
    $("tree").innerHTML = conflictTreeHtml() + (html || '<div class="empty">No findings match.</div>');
  }
  function visibleIds() {
    return Array.prototype.map.call(document.querySelectorAll("#tree .item"), function (e) { return +e.getAttribute("data-id"); });
  }

  // ------------------------------------------------------------------ card
  function card(f) {
    var sevBadge = '<span class="badge ' + f.severity + '">' + f.severity + "</span>" + (f.confidence === "UNCERTAIN" ? '<span class="badge UNC">UNCERTAIN</span>' : "");
    var dl = "";
    Object.keys(f.details).forEach(function (k) {
      if (k.indexOf("diff") === 0) return;
      dl += "<dt>" + esc(k) + "</dt><dd>" + esc(f.details[k]) + "</dd>";
    });
    var jumps = f.targets.map(function (t, i) {
      return '<div class="jump' + (i === state.target ? " on" : "") + '" data-t="' + i + '"><span class="side">' + (t.side === "base" ? "base" : t.side) + '</span><span class="loc">' + esc(t.path + (t.line ? ":" + t.line : "")) + '</span><span class="lbl">' + esc(t.label) + "</span></div>";
    }).join("");
    $("card").innerHTML = '<div class="row1">' + sevBadge + '<span class="tag">' + esc(f.category) + '</span><span class="tag">' + esc(f.status) + '</span><span class="tag">' + esc(f.kind) + '</span><span class="tag">origin: ' + esc(f.origin) + '</span><span class="hint" style="margin-left:auto">#' + f.id + " \u00B7 <kbd>\u2191</kbd><kbd>\u2193</kbd> findings \u00B7 <kbd>F7</kbd>/<kbd>Shift+F7</kbd> changes</span></div>" +
      '<div class="symbol">' + esc(f.symbol) + '</div><div class="msg">' + esc(f.message) + "</div>" +
      chainLine(f) + (dl ? "<dl>" + dl + "</dl>" : "") + (jumps && state.tab === "code" ? '<div class="jumps">' + jumps + "</div>" : "");
  }
  function chainLine(f) {
    var c = chainOf(f);
    if (!c) return "";
    var root = nodeOf(c.root), others = c.findings.filter(function (id) { return id !== f.id; });
    if (!others.length && c.root === fctx(f).node) return "";
    return '<div class="chainline">\u26D3 ' + (others.length ? "Part of chain <b>" + c.id + "</b> (" + c.findings.length + " findings)" : "Chain <b>" + c.id + "</b>") +
      ' rooted at <span class="nl" data-node="' + esc(c.root) + '" title="' + esc(root ? root.symbol : "") + '">' + esc(root ? root.label : c.root) + "</span>" +
      (others.length ? " \u00B7 with " + others.map(function (id) { return '<span class="fchip" data-fid="' + id + '">#' + id + "</span>"; }).join(" ") : "") +
      ' \u00B7 <span class="nl" data-tab="deps">dependency tree</span> \u00B7 <span class="nl" data-tab="check">port checklist</span></div>';
  }

  // ------------------------------------------------------------------ syntax highlighting
  var JAVA_KW = {};
  ("abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while var record yield sealed permits true false null").split(" ").forEach(function (k) { JAVA_KW[k] = 1; });
  var tokCache = {};
  function tokenizeFile(path, side, text, lang) {
    var key = path + "\u0000" + side;
    if (tokCache[key]) return tokCache[key];
    var lines = splitLines(text), st = {}, out = [];
    for (var i = 0; i < lines.length; i++) out.push(tokLine(lines[i], st, lang));
    tokCache[key] = out;
    return out;
  }
  function splitLines(text) {
    if (text == null || text === "") return [];
    var t = text.replace(/\r\n?/g, "\n");
    if (t.charAt(t.length - 1) === "\n") t = t.slice(0, -1);
    return t.split("\n");
  }
  function tokLine(line, st, lang) {
    if (lang === "java") return tokJava(line, st);
    if (lang === "xml") return tokXml(line, st);
    if (lang === "yaml") return tokYaml(line);
    if (lang === "properties") return tokProps(line);
    return [[line, ""]];
  }
  function tokJava(line, st) {
    var out = [], i = 0, n = line.length, m;
    function push(t, c) { if (t) out.push([t, c]); }
    while (i < n) {
      if (st.block) { var e = line.indexOf("*/", i); if (e < 0) { push(line.slice(i), "cm"); return out; } push(line.slice(i, e + 2), "cm"); i = e + 2; st.block = false; continue; }
      if (st.text) { var e2 = line.indexOf('"""', i); if (e2 < 0) { push(line.slice(i), "str"); return out; } push(line.slice(i, e2 + 3), "str"); i = e2 + 3; st.text = false; continue; }
      var ch = line.charAt(i), rest = line.slice(i);
      if (ch === "/" && line.charAt(i + 1) === "*") { st.block = true; push("/*", "cm"); i += 2; continue; }
      if (ch === "/" && line.charAt(i + 1) === "/") { push(rest, "cm"); return out; }
      if (rest.indexOf('"""') === 0) { st.text = true; push('"""', "str"); i += 3; continue; }
      if (ch === '"' || ch === "'") { var j = i + 1; while (j < n && line.charAt(j) !== ch) { if (line.charAt(j) === "\\") j++; j++; } push(line.slice(i, j + 1), "str"); i = j + 1; continue; }
      if (ch === "@" && (m = /^@[A-Za-z_][\w.]*/.exec(rest))) { push(m[0], "ann"); i += m[0].length; continue; }
      if ((m = /^(0[xX][\da-fA-F_]+|\d[\d_]*(\.\d+)?([eE][+-]?\d+)?)[lLfFdD]?/.exec(rest)) && !/[\w$]/.test(line.charAt(i - 1) || "")) { push(m[0], "num"); i += m[0].length; continue; }
      if ((m = /^[A-Za-z_$][\w$]*/.exec(rest))) { push(m[0], JAVA_KW[m[0]] ? "kw" : ""); i += m[0].length; continue; }
      m = /^[^\/"'@\w$]+|^./.exec(rest); push(m[0], ""); i += m[0].length;
    }
    return out;
  }
  function tokXml(line, st) {
    var out = [], i = 0, n = line.length, m;
    function push(t, c) { if (t) out.push([t, c]); }
    while (i < n) {
      var rest = line.slice(i);
      if (st.comment) { var e = line.indexOf("-->", i); if (e < 0) { push(rest, "cm"); return out; } push(line.slice(i, e + 3), "cm"); i = e + 3; st.comment = false; continue; }
      if (st.cdata) { var e3 = line.indexOf("]]>", i); if (e3 < 0) { push(rest, ""); return out; } push(line.slice(i, e3), ""); push("]]>", "tag"); i = e3 + 3; st.cdata = false; continue; }
      if (st.tag) {
        if ((m = /^\s+/.exec(rest))) { push(m[0], ""); i += m[0].length; continue; }
        if ((m = /^\/?>|^\?>/.exec(rest))) { push(m[0], "tag"); i += m[0].length; st.tag = false; continue; }
        if (rest.charAt(0) === '"' || rest.charAt(0) === "'") { var q = rest.charAt(0), j = rest.indexOf(q, 1); var s = j < 0 ? rest : rest.slice(0, j + 1); pushVars(out, s, "str"); i += s.length; continue; }
        if ((m = /^[\w:.\-]+/.exec(rest))) { push(m[0], "attr"); i += m[0].length; continue; }
        push(rest.charAt(0), ""); i++; continue;
      }
      if (rest.indexOf("<!--") === 0) { st.comment = true; push("<!--", "cm"); i += 4; continue; }
      if (rest.indexOf("<![CDATA[") === 0) { st.cdata = true; push("<![CDATA[", "tag"); i += 9; continue; }
      if ((m = /^<[?!\/]?[\w:.\-]*/.exec(rest)) && m[0].length > 1) { push(m[0], "tag"); i += m[0].length; st.tag = true; continue; }
      if ((m = /^&[#\w]+;/.exec(rest))) { push(m[0], "ent"); i += m[0].length; continue; }
      m = /^[^<&]+/.exec(rest) || [rest.charAt(0)];
      pushVars(out, m[0], ""); i += m[0].length;
    }
    return out;
  }
  function pushVars(out, s, cls) {
    var re = /[#$]\{[^}]*\}/g, last = 0, m;
    while ((m = re.exec(s))) { if (m.index > last) out.push([s.slice(last, m.index), cls]); out.push([m[0], "var"]); last = m.index + m[0].length; }
    if (last < s.length) out.push([s.slice(last), cls]);
  }
  function tokYaml(line) {
    var out = [], m;
    if (/^\s*#/.test(line)) return [[line, "cm"]];
    var body = line, comment = "";
    var cm = /\s#.*$/.exec(line);
    if (cm && !/["'][^"']*\s#/.test(line)) { body = line.slice(0, cm.index); comment = line.slice(cm.index); }
    if ((m = /^(\s*-?\s*)([^\s:#][^:]*?)(\s*:)(?=\s|$)/.exec(body))) {
      out.push([m[1], ""]); out.push([m[2], "key"]); out.push([m[3], ""]); body = body.slice(m[0].length);
    }
    var v = /^(\s*)(.*)$/.exec(body);
    if (v[1]) out.push([v[1], ""]);
    var val = v[2];
    if (/^(["']).*\1$/.test(val)) pushVars(out, val, "str");
    else if (/^(true|false|null|~|-?\d+(\.\d+)?)$/.test(val)) out.push([val, "num"]);
    else pushVars(out, val, "");
    if (comment) out.push([comment, "cm"]);
    return out;
  }
  function tokProps(line) {
    if (/^\s*[#!]/.test(line)) return [[line, "cm"]];
    var m = /^(\s*)((?:\\.|[^=:\s])+)(\s*[=:]\s*|\s+)?(.*)$/.exec(line);
    if (!m) return [[line, ""]];
    var out = [[m[1], ""], [m[2], "key"], [m[3] || "", ""]];
    pushVars(out, m[4], "");
    return out;
  }

  // ------------------------------------------------------------------ inline (word-level) diff
  function wordRanges(a, b) {
    var ta = a.match(/\w+|\s+|[^\w\s]/g) || [], tb = b.match(/\w+|\s+|[^\w\s]/g) || [];
    var n = ta.length, m = tb.length;
    if (!n || !m) return [[[0, a.length]], [[0, b.length]]];
    if (n * m > 160000) return prefixSuffix(a, b);
    var dp = new Array(n + 1);
    for (var i = 0; i <= n; i++) dp[i] = new Uint16Array(m + 1);
    for (i = n - 1; i >= 0; i--) for (var j = m - 1; j >= 0; j--) dp[i][j] = ta[i] === tb[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    var ka = [], kb = [], pa = 0, pb = 0, same = 0;
    i = 0; j = 0;
    while (i < n && j < m) {
      if (ta[i] === tb[j]) { pa += ta[i].length; pb += tb[j].length; if (/\S/.test(ta[i])) same += ta[i].length; i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { ka.push([pa, pa + ta[i].length]); pa += ta[i].length; i++; }
      else { kb.push([pb, pb + tb[j].length]); pb += tb[j].length; j++; }
    }
    while (i < n) { ka.push([pa, pa + ta[i].length]); pa += ta[i++].length; }
    while (j < m) { kb.push([pb, pb + tb[j].length]); pb += tb[j++].length; }
    // lines that share almost nothing are shown as plain changed lines, without word highlights
    if (same < 0.25 * Math.min(a.replace(/\s/g, "").length, b.replace(/\s/g, "").length)) return [[], []];
    return [merge(ka), merge(kb)];
  }
  function prefixSuffix(a, b) {
    var p = 0; while (p < a.length && p < b.length && a.charAt(p) === b.charAt(p)) p++;
    var s = 0; while (s < a.length - p && s < b.length - p && a.charAt(a.length - 1 - s) === b.charAt(b.length - 1 - s)) s++;
    return [[[p, a.length - s]], [[p, b.length - s]]];
  }
  function merge(rs) {
    var out = [];
    rs.forEach(function (r) { if (out.length && out[out.length - 1][1] >= r[0]) out[out.length - 1][1] = r[1]; else out.push([r[0], r[1]]); });
    return out.filter(function (r) { return r[1] > r[0]; });
  }
  function lineHtml(tokens, ranges) {
    var html = "", pos = 0, indent = 0;
    ranges = ranges || [];
    // indentation is non-breaking so wrapped lines never break right after the indent
    var full = tokens.map(function (tk) { return tk[0]; }).join("");
    indent = /^[ \t]*/.exec(full)[0].length;

      if (to.impact.length) {
        html += '<div class="sec">Tenant callers <span class="hint">who in the tenant uses the ours-side members (up to ' + (CTX ? CTX.maxImpactDepth : 3) + " levels)</span></div>";
        to.impact.forEach(function (t) { html += treeHtml(t, 0, "impact", null, null, null); });
      }
      if (h.findings.length) html += '<div class="sec">Related findings ' + fchips(h.findings, null) + "</div>";
    } else if (state.ctab === "c-check") {
      html += '<div class="sec">Migration checklist <span class="hint">dependencies first: commits to consider, symbols to bring, places to adapt, then each hunk</span></div>';
      html += '<ol class="check">' + CONF.checklist.map(function (it) {
        var key = "chk" + it.step, mine = it.hunks.indexOf(h.id) >= 0;
        return '<li class="' + (state.done[key] ? "done " : "") + (mine ? "mine " : "") + '"' + (it.node ? ' data-node="' + esc(it.node) + '"' : "") + '><span class="stepn">' + it.step + '.</span><input type="checkbox" data-done="' + key + '"' + (state.done[key] ? " checked" : "") + ' title="mark as done (not saved)">' +
          '<span class="what"><span class="ab ab-' + esc(it.action) + '">' + esc(it.action.replace(/_/g, " ").toLowerCase()) + '</span><span class="lbl mono">' + esc(it.target) + "</span></span>" +
          '<span class="why">' + esc(it.why || "") + (it.hunks.length ? '<br>' + it.hunks.map(function (x) { return HUNKS[x] ? '<span class="hchip' + (x === h.id ? " cur" : "") + '" data-hid="' + esc(x) + '">' + esc(x.split("/").pop()) + "</span>" : '<span class="hint">' + esc(x.split("/").pop()) + "</span>"; }).join(" ") : "") + "</span></li>";
      }).join("") + "</ol>";
      if (CONF.bringAlong.length) {
        html += '<div class="sec">Mainline commits the pick depends on <span class="hint">oldest first</span></div><table class="ctable"><thead><tr><th>commit</th><th>provides</th><th>needed by</th></tr></thead><tbody>' + CONF.bringAlong.map(function (c) {
          return "<tr><td>" + sha8(c.commit) + ' <span class="det">' + esc(day(c.commit.date)) + "</span><div>" + esc(c.commit.subject) + '</div></td><td class="det">' + esc(c.provides.join(", ")) + '</td><td class="det">' + esc(c.neededBy.map(function (x) { return x.split("/").pop(); }).join(", ")) + "</td></tr>";
        }).join("") + "</tbody></table>";
      }
      if (CONF.limitations.length) html += '<ul class="limits">' + CONF.limitations.map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ul>";
    }
    box.innerHTML = html;
  }

  // ------------------------------------------------------------------ init
  header();
  if (CONF) conflictHeader();
  var FIND_TABS = $("tabs").innerHTML;
  var q = readHash();
  setTheme(q.theme || "light");
  state.modeLocked = !!q.mode;
  setMode(q.mode || "3col");
  state.groupBy = q.group === "chain" && CTX ? "chain" : "sev";
  if (!CTX) $("groupSeg").style.display = "none";
  document.querySelectorAll("#groupSeg button").forEach(function (x) { x.classList.toggle("on", x.getAttribute("data-group") === state.groupBy); });
  state.tab = CTX && ["deps", "impact", "check", "overview"].indexOf(q.tab) >= 0 ? q.tab : "code";
  state.ovScope = q.ov === "all" ? "all" : "chain";
  document.querySelectorAll("#tabs button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-tab") === state.tab); });
  tree();
  if (CONF && HUNK_ORDER.length && (q.hunk || !q.finding)) {
    selectHunk(HUNKS[q.hunk] || q.hunk === "__check" ? q.hunk : HUNK_ORDER[0], { ctab: CTABS.some(function (t) { return t[0] === q.ctab; }) ? q.ctab : "c-conflict", node: q.node || null });
    return;
  }
  var first = +q.finding || (DATA.findings.find(function (f) { return f.group === "HIGH"; }) || DATA.findings[0] || {}).id;
  if (first) select(first, Object.assign(q.target ? { target: +q.target } : {}, q.node ? { node: q.node } : {}));
  else { $("card").innerHTML = '<div class="empty">No findings.</div>'; renderDiff(null); }
})();
</script>
</body>
</html>
