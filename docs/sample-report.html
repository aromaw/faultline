* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.45 var(--ui-font); overflow: hidden; }
code, .mono { font-family: var(--mono); font-size: 12px; }
button { font: inherit; color: inherit; }
#top { display: flex; align-items: center; gap: 16px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--border); height: 52px; }
#top .brand { font-weight: 700; font-size: 15px; letter-spacing: .2px; }
#top .brand span { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
#top .refs { display: grid; grid-template-columns: auto auto auto; column-gap: 14px; row-gap: 0; font-size: 12px; color: var(--muted); flex: 1; min-width: 0; }
#top .refs b { color: var(--fg); font-weight: 600; }
#top .refs div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { display: flex; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--border); font-size: 12px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.g-HIGH { background: var(--high); } .g-MEDIUM { background: var(--medium); } .g-LOW { background: var(--low); } .g-UNCERTAIN { background: var(--unc); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); padding: 3px 10px; cursor: pointer; font-size: 12px; }
.seg button.on { background: var(--accent); color: #fff; }
.btn { border: 1px solid var(--border); background: var(--bg); border-radius: 5px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
.btn:hover { background: var(--hover); }
#main { display: flex; height: calc(100% - 52px); }
#side { width: 330px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--border); }
#side .search { padding: 8px; border-bottom: 1px solid var(--border); }
#search { width: 100%; padding: 5px 8px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); color: var(--fg); font: inherit; }
#filters { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
#filters label { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; font-size: 11.5px; user-select: none; }
#filters input { margin: 0; }
#tree { overflow: auto; flex: 1; padding: 4px 0 20px; }
.grp > .gh { display: flex; align-items: center; gap: 6px; padding: 4px 8px; font-weight: 600; cursor: pointer; user-select: none; }
.cat > .ch { display: flex; align-items: center; gap: 6px; padding: 2px 8px 2px 22px; color: var(--muted); cursor: pointer; user-select: none; font-size: 12px; }
.count { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 11.5px; }
.caret { width: 10px; display: inline-block; color: var(--muted); font-size: 10px; }
.collapsed > .items, .collapsed > .cats { display: none; }
.item { padding: 3px 8px 3px 38px; cursor: pointer; display: flex; flex-direction: column; border-left: 3px solid transparent; }
.item:hover { background: var(--hover); }
.item.sel { background: var(--sel); color: var(--sel-fg); border-left-color: var(--accent); }
.item .l1 { display: flex; gap: 6px; align-items: center; min-width: 0; }
.item .sym { font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.item.sel .num { color: inherit; }
#content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#card { padding: 10px 14px; border-bottom: 1px solid var(--border); max-height: 40%; overflow: auto; }
#card .row1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 4px; color: #fff; }

.jump.on .side { color: inherit; }

td.gap.h { background: var(--border); }

.in { border-radius: 2px; }

tr.target td.ln.tside { background: var(--target); color: var(--fg); font-weight: 700; }
tr.target td.code.tside.k-eq, tr.target td.code.tside.k-basechg { background: var(--target); }
tr.flash td.code { animation: flash 1s ease-out; }
@keyframes flash { from { filter: brightness(.85); } to { filter: none; } }
tr.fold td { background: var(--panel); color: var(--muted); text-align: center; cursor: pointer; font: 11.5px var(--ui-font); padding: 2px; border-top: 1px dashed var(--border); border-bottom: 1px dashed var(--border); }
tr.fold td:hover { color: var(--accent); }
.empty { padding: 30px; color: var(--muted); }
.absent { color: var(--muted); font-style: italic; }

  // ------------------------------------------------------------------ tree

  }

  // ------------------------------------------------------------------ inline (word-level) diff

  }
  function prefixSuffix(a, b) {

  function merge(rs) {

  }
  function lineHtml(tokens, ranges) {

    if (indent === full.length) indent = 0;
    tokens.forEach(function (tk) {
      var t = tk[0], c = tk[1], k = 0;
      while (k < t.length) {
        var abs = pos + k, inR = false, next = pos + t.length;

          if (abs >= ranges[r][0] && abs < ranges[r][1]) { inR = true; next = Math.min(next, ranges[r][1]); }

        }

        var piece = esc(raw);
        if (c) piece = '<span class="tk-' + c + '">' + piece + "</span>";
        html += inR ? '<span class="in">' + piece + "</span>" : piece;

    });
    return html;
  }

  // ------------------------------------------------------------------ rows
  // A row has one cell per column: {side, idx (0-based line or -1), kind}; hunk rows carry the hunk index.
  function buildRows(file, mode) {
    var cols = mode === "2col" ? ["ours", "theirs"] : ["ours", "base", "theirs"];
    var L = {}; cols.forEach(function (s) { L[s] = splitLines(file[s]); });
    var rows = [], p = { ours: 0, base: 0, theirs: 0 };
    function equalRun(count) {
      for (var k = 0; k < count; k++) {
        rows.push({ hunk: -1, cells: cols.map(function (s) { return { side: s, idx: p[s] + k, kind: "eq" }; }) });
      }
      cols.forEach(function (s) { p[s] += count; });
    }
    if (mode === "2col") {
      file.hunks2.forEach(function (h, hi) {
        equalRun(h.l[0] - p.ours);
        var lo = h.l[1] - h.l[0], lt = h.r[1] - h.r[0], n = Math.max(lo, lt);
        for (var k = 0; k < n; k++) {
          rows.push({ hunk: hi, cells: [
            k < lo ? { side: "ours", idx: h.l[0] + k, kind: lt === 0 ? "del" : "mod", pair: k < lt ? h.r[0] + k : -1 } : { side: "ours", idx: -1, kind: lo === 0 ? "delpad" : "pad" },
            k < lt ? { side: "theirs", idx: h.r[0] + k, kind: lo === 0 ? "add" : "mod", pair: k < lo ? h.l[0] + k : -1 } : { side: "theirs", idx: -1, kind: lt === 0 ? "delpad" : "pad" }
          ] });
        }
        p.ours = h.l[1]; p.theirs = h.r[1];
      });
      equalRun(Math.max(0, L.ours.length - p.ours));
      return { cols: cols, rows: rows, lines: L };
    }
    file.hunks3.forEach(function (h, hi) {
      equalRun(h.b[0] - p.base);
      var lb = h.b[1] - h.b[0], lo = h.o[1] - h.o[0], lt = h.t[1] - h.t[0], n = Math.max(lb, lo, lt);
      var oCh = h.type !== "theirs", tCh = h.type !== "ours", conf = h.type === "conflict";
      function sideCell(s, start, len, changed, k) {
        if (k < len) {
          if (!changed) return { side: s, idx: start + k, kind: "eq" };
          return { side: s, idx: start + k, kind: conf ? "conf" : (lb === 0 ? "add" : "mod"), pair: k < lb ? h.b[0] + k : -1 };
        }
        return { side: s, idx: -1, kind: changed && len === 0 ? "delpad" : "pad" };
      }
      var allDeleted = (!oCh || lo === 0) && (!tCh || lt === 0);
      // base lines are word-diffed against the side that changed them (ours when both made the same edit)
      function baseCell(k) {
        var c = { side: "base", idx: h.b[0] + k, kind: conf ? "baseconf" : (allDeleted ? "del" : "basechg") };
        if (!conf && !allDeleted) { c.pairSide = oCh ? "ours" : "theirs"; c.pair = k < (oCh ? lo : lt) ? (oCh ? h.o[0] : h.t[0]) + k : -1; }
        return c;
      }
      for (var k = 0; k < n; k++) {
        rows.push({ hunk: hi, type: h.type, cells: [
          sideCell("ours", h.o[0], lo, oCh, k),
          k < lb ? baseCell(k) : { side: "base", idx: -1, kind: "pad" },
          sideCell("theirs", h.t[0], lt, tCh, k)
        ] });
      }
      p.base = h.b[1]; p.ours = h.o[1]; p.theirs = h.t[1];
    });
    equalRun(Math.max(0, L.base.length - p.base));
    // the base may be shorter than a side that appended lines after the last hunk
    return { cols: cols, rows: rows, lines: L };
  }

  // ------------------------------------------------------------------ diff view
  var view = null;
  function sideTitle(s) {
    var m = DATA.meta, r = s === "base" ? { ref: "merge-base", sha: m.refs.mergeBase } : refParts(m.refs[s]);
    return (s === "base" ? "merge-base" : s + (r.ref ? " \u2014 " + r.ref : "")) + " (" + short(r.sha) + ")";
  }
  function renderDiff(f) {
    var targets = f ? f.targets : [];
    var t = targets[state.target];
    var paths = [];
    targets.forEach(function (x) { if (paths.indexOf(x.path) < 0) paths.push(x.path); });
    if (!state.path || paths.indexOf(state.path) < 0) state.path = t ? t.path : paths[0];
    var file = state.path ? DATA.files[state.path] : null;
    var fb = "";
    if (state.path) {
      fb += '<span class="path">' + esc(state.path) + "</span>";
      if (paths.length > 1) fb += '<span class="seg" id="fileSeg">' + paths.map(function (p) { return '<button data-path="' + esc(p) + '" class="' + (p === state.path ? "on" : "") + '">' + esc(p.split("/").pop()) + "</button>"; }).join("") + "</span>";
      fb += '<button class="btn" id="prevCh" title="Previous change (Shift+F7)">\u25B2</button><button class="btn" id="nextCh" title="Next change (F7)">\u25BC</button><button class="btn" id="expandAll">Expand all</button>';
      fb += '<span class="legend"><span><i style="background:var(--add)"></i>added</span><span><i style="background:var(--mod)"></i>changed</span><span><i style="background:var(--del)"></i>deleted</span><span><i style="background:var(--conf)"></i>conflict</span><span><i style="background:var(--target);border-color:var(--target-bd)"></i>finding</span></span>';
    }
    $("filebar").innerHTML = fb;
    if (!file) { $("diff").innerHTML = '<div class="empty">' + (f ? "This finding has no file location." : "Select a finding.") + "</div>"; view = null; return; }
    var cols = state.mode === "2col" ? ["ours", "theirs"] : ["ours", "base", "theirs"];
    if (cols.every(function (s) { return file[s] == null; })) {
      $("diff").innerHTML = '<div class="empty">File content not available' + (file.notes && file.notes.length ? ": " + esc(file.notes.join("; ")) : "") + ".</div>";
      view = null; return;
    }
    var built = buildRows(file, state.mode);
    var tk = {};
    cols.forEach(function (s) { tk[s] = tokenizeFile(state.path, s, file[s], file.lang); });
    var baseLines = splitLines(file.base), oursLines = built.lines.ours, theirsLines = built.lines.theirs;
    // target row: the row showing the target's line on the target's side (base targets fall back to ours in 2-col)
    var tSide = t && t.path === state.path ? t.side : null, tLine = t && t.path === state.path ? t.line - 1 : -1;
    if (tSide === "base" && state.mode === "2col") tSide = null;
    var targetRow = -1;
    built.rows.forEach(function (r, ri) { r.cells.forEach(function (c) { if (c.side === tSide && c.idx === tLine && targetRow < 0) targetRow = ri; }); });
    // folding: keep rows near hunks and near the target
    var keep = new Uint8Array(built.rows.length);
    built.rows.forEach(function (r, ri) {
      if (r.hunk >= 0 || ri === targetRow) for (var k = Math.max(0, ri - (ri === targetRow ? 6 : CTX)); k <= Math.min(built.rows.length - 1, ri + (ri === targetRow ? 6 : CTX)); k++) keep[k] = 1;
    });
    var exp = state.expanded[state.path + "|" + state.mode] || {};
    var html = "<table class=\"diff\"><colgroup>";
    cols.forEach(function (s, i) { if (i) html += '<col class="gap">'; html += '<col class="ln"><col>'; });

    cols.forEach(function (s, i) {
      if (i) html += '<th class="gap"></th>';

        if (ci) html += '<td class="gap' + (r.hunk >= 0 ? " h" : "") + '"></td>';
        var ts = ri === targetRow && c.side === tSide ? " tside" : "";

        var text = built.lines[c.side] ? built.lines[c.side][c.idx] : baseLines[c.idx];
        var ranges = null;
        if ((c.kind === "mod" || c.kind === "conf") && c.pair != null && c.pair >= 0) {
          var other = state.mode === "2col" ? (c.side === "ours" ? theirsLines[c.pair] : oursLines[c.pair]) : baseLines[c.pair];
          if (other != null) { var wr = wordRanges(other, text); ranges = wr[1]; }
        } else if (c.kind === "basechg" && c.pair != null && c.pair >= 0) {
          var changed = built.lines[c.pairSide][c.pair];
          if (changed != null) ranges = wordRanges(text, changed)[0];
        }
        html += '<td class="ln' + ts + '">' + (c.idx + 1) + '</td><td class="code k-' + c.kind + ts + '">' + (lineHtml(tk[c.side][c.idx] || [[text, ""]], ranges) || " ") + "</td>";
      });
      html += "</tr>";
      ri++;
    }
    html += "</tbody></table>";
    if (file.notes && file.notes.length) html = '<div class="empty" style="padding:6px 10px">' + esc(file.notes.join("; ")) + "</div>" + html;
    $("diff").innerHTML = html;
    view = { targetRow: targetRow, cur: targetRow >= 0 ? built.rows[targetRow].hunk : -1 };
    var tr = targetRow >= 0 ? document.querySelector('#diff tr[data-r="' + targetRow + '"]') : null;
    if (tr) scrollToRow(tr);
    else { var first = document.querySelector("#diff tr[data-h]"); if (first) scrollToRow(first); else $("diff").scrollTop = 0; }
  }
  function scrollToRow(tr) {
    var d = $("diff");
    d.scrollTop = Math.max(0, tr.offsetTop - d.clientHeight / 2 + tr.offsetHeight / 2);
  }
  function jumpHunk(dir) {
    var rows = Array.prototype.slice.call(document.querySelectorAll("#diff tr[data-h]"));
    if (!rows.length || !view) return;
    var starts = rows.filter(function (r, i) { return i === 0 || rows[i - 1].getAttribute("data-h") !== r.getAttribute("data-h"); });
    var cur = -1;
    starts.forEach(function (r, i) { if (+r.getAttribute("data-h") === view.cur) cur = i; });
    var pick;
    if (cur >= 0) pick = (cur + dir + starts.length) % starts.length;
    else {
      // no current change yet: take the first change below (or above) the middle of the viewport
      var d = $("diff"), mid = d.scrollTop + d.clientHeight / 2;
      pick = dir > 0 ? starts.findIndex(function (r) { return r.offsetTop > mid; }) : -1;
      if (dir < 0) for (var i = starts.length - 1; i >= 0; i--) if (starts[i].offsetTop < mid) { pick = i; break; }

  // ------------------------------------------------------------------ selection / state
  function select(id, opts) {

  function writeHash() {

  }
  function setMode(m) {
    state.mode = m === "2col" ? "2col" : "3col";
    document.querySelectorAll("#modeSeg button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-mode") === state.mode); });
  }
  function setTheme(t) {
    state.theme = t === "dark" ? "dark" : "light";
    document.body.className = state.theme;
    $("themeBtn").textContent = state.theme === "dark" ? "Light" : "Dark";
  }

  // ------------------------------------------------------------------ events
  $("tree").addEventListener("click", function (e) {
    var it = e.target.closest(".item");
    if (it) { select(+it.getAttribute("data-id"), { noScroll: true }); return; }
    var gh = e.target.closest(".gh, .ch");
    if (gh) { var box = gh.parentNode, key = box.getAttribute("data-g") || box.getAttribute("data-c"); state.collapsed[key] = !state.collapsed[key]; tree(); }
  });
  $("card").addEventListener("click", function (e) {
    var j = e.target.closest(".jump");
    if (j) select(state.sel, { target: +j.getAttribute("data-t") });
  });
  $("filebar").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.id === "nextCh") jumpHunk(1);
    else if (b.id === "prevCh") jumpHunk(-1);
    else if (b.id === "expandAll") { var all = {}; for (var i = 0; i < 100000; i++) all[i] = 1; state.expanded[state.path + "|" + state.mode] = all; renderDiff(byId[state.sel]); }
    else if (b.getAttribute("data-path")) { state.path = b.getAttribute("data-path"); renderDiff(byId[state.sel]); }
  });
  $("diff").addEventListener("click", function (e) {
    var tr = e.target.closest("tr.fold");
    if (!tr) return;
    var key = state.path + "|" + state.mode, exp = state.expanded[key] || (state.expanded[key] = {});
    for (var i = +tr.getAttribute("data-from"); i < +tr.getAttribute("data-to"); i++) exp[i] = 1;
    var top = $("diff").scrollTop;
    renderDiff(byId[state.sel]);
    $("diff").scrollTop = top;
  });
  $("modeSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    setMode(b.getAttribute("data-mode")); renderDiff(byId[state.sel]); writeHash();
  });
  $("themeBtn").addEventListener("click", function () { setTheme(state.theme === "dark" ? "light" : "dark"); writeHash(); });
  $("search").addEventListener("input", function () { state.q = this.value.trim().toLowerCase(); tree(); });
  $("filters").addEventListener("change", function (e) {
    var g = e.target.getAttribute("data-g"); if (!g) return;
    state.hidden[g] = !e.target.checked; tree();
  });
  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.id === "search" && e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    if (e.key === "F7") { e.preventDefault(); jumpHunk(e.shiftKey ? -1 : 1); return; }
    var dir = (e.key === "ArrowDown" || e.key === "j") ? 1 : (e.key === "ArrowUp" || e.key === "k") ? -1 : 0;
    if (!dir) return;
    e.preventDefault();
    var ids = visibleIds(); if (!ids.length) return;
    var i = ids.indexOf(state.sel);
    select(ids[i < 0 ? 0 : Math.min(ids.length - 1, Math.max(0, i + dir))]);
  });

  // ------------------------------------------------------------------ init
  header();
  var q = readHash();
  setTheme(q.theme || "light");
  setMode(q.mode || "3col");
  tree();
  var first = +q.finding || (DATA.findings.find(function (f) { return f.group === "HIGH"; }) || DATA.findings[0] || {}).id;
  if (first) select(first, q.target ? { target: +q.target } : {});
  else { $("card").innerHTML = '<div class="empty">No findings.</div>'; renderDiff(null); }
})();
</script>
