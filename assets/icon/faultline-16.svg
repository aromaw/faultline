<?xml version="1.0" encoding="UTF-8"?>
<!-- faultline app icon, 16 px variant: the same design with two strata per side, aligned to the pixel grid. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D7BF7"/>
      <stop offset="1" stop-color="#7A4BE8"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="15" height="15" rx="3.5" fill="url(#bg)"/>
  <!-- left strata -->
  <rect x="3" y="4" width="5" height="2" fill="#FFFFFF"/>
  <rect x="3" y="8" width="4" height="2" fill="#FFFFFF" fill-opacity="0.7"/>
  <!-- right strata, displaced down -->
  <rect x="9" y="6" width="4" height="2" fill="#FFFFFF"/>
  <rect x="8" y="10" width="5" height="2" fill="#FFFFFF" fill-opacity="0.7"/>
  <!-- the fault line -->
  <polyline points="9.5,2 8,7.5 8.5,8.5 7,14" fill="none" stroke="#FF9F43" stroke-width="1.4"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
